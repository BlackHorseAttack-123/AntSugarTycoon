<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ant Sugar Tycoon 🐜</title>
<style>
    body { margin: 0; padding: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
    
    /* 💡 NÂNG CẤP CHỐNG MÉO: Đổi width cố định thành max-width và dùng box-sizing để chặn co dẹt hình */
    #game-container { 
        width: 100vw; 
        max-width: 450px; 
        height: auto; 
        max-height: 630px; 
        display: flex; 
        flex-direction: column; 
        box-shadow: 0 0 25px rgba(0,0,0,0.9); 
        position: relative; 
        border-radius: 4px; 
        overflow: hidden; 
        box-sizing: border-box;
    }
    
    /* 💡 KHÓA CHẶT TỶ LỆ HÌNH VUÔNG: Ép canvas luôn giữ đúng tỷ lệ 1:1, dù màn hình nhỏ cũng không bị bóp méo */
    canvas { 
        background: #228B22; 
        width: 100% !important; 
        height: auto !important; 
        aspect-ratio: 1 / 1; 
        display: block; 
    }
    
    /* Bảng điểm UI Dashboard */
    #dashboard { background: #141414; height: 60px; color: #fff; padding: 6px 15px; box-sizing: border-box; font-size: 13px; line-height: 18px; width: 100%; border-bottom: 1px solid #2a2a2a; }
    
    /* Tay cầm cảm ứng dưới đáy màn hình */
    #pad { background: #1e1e23; height: 120px; display: grid; grid-template-areas: ". up ." "left . right" ". down ."; grid-template-rows: repeat(3, 40px); grid-template-columns: repeat(3, 33.33%); justify-items: center; align-items: center; box-sizing: border-box; padding: 5px; width: 100%; }
    
    .btn { width: 80%; height: 35px; background: #3c3c46; border: 2px solid #64646e; border-radius: 8px; color: #fff; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.1s; }
    .btn:active { background: #5a5a69; border-color: #888896; }
    #btn-up { grid-area: up; } #btn-down { grid-area: down; } #btn-left { grid-area: left; } #btn-right { grid-area: right; }
    
    /* Khung thông báo phủ khít theo canvas hình vuông */
    #msg-screen { position: absolute; top: 0; left: 0; width: 100%; height: auto; aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; z-index: 10; font-weight: bold; cursor: pointer; box-sizing: border-box; padding: 20px 10px; }
    
    @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .blink-text { animation: blink 1.2s infinite; font-size: 15px !important; letter-spacing: 0.5px; }
</style>

    
</head>
<body>
<div id="game-container">
    <div id="msg-screen" style="background: #323232;">
        <div id="msg-title" style="font-size: 22px; color: #00ffff; margin-bottom: 15px; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">STAGE 1: Tích Trữ Đường</div>
        <div id="msg-sub" style="width: 100%;"></div>
    </div>
    <canvas id="gameCanvas" width="450" height="450"></canvas>
    <div id="dashboard">
        <div id="ui-stage" style="color: #00ffff; font-weight: bold;">Stage: 1/3 | Kỷ lục: 0</div>
        <div id="ui-nest">Trong Tổ: 0/10 | Tổng Điểm: 0</div>
        <div id="ui-cargo">Chiều dài kiến: 0 đốt (0% / 0%)</div>
    </div>
    <div id="pad">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
        <div class="btn" id="btn-down">▼</div>
    </div>
</div>
<script src="game_config.js"></script>
<script src="game_stages.js"></script>
<script src="fireworks.js"></script>
<script src="game.js"></script>
</body>
</html>
